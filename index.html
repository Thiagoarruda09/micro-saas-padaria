<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padaria paes & paes</title>
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/custom.css">
   
</head>
<body >
    <main class="container card card-body mt-4 col-12" id="Pagina_principal">

        <div class=" card card-body shadow-sm col-12">
            <h2>Registrar venda </h2>
            <form onsubmit="AddVenda(event)" action="" class="d-flex flex-row col-12 gap-3">
                <select name="" id="Select_produtos" >
                    <option value="">Selecione o produto</option>

                </select>
                <button type="button"  data-bs-toggle="modal" data-bs-target="#exampleModal" id="button_add_produto">
                    Adicionar produto
                  </button>
                
                <input type="text" placeholder="Quantidade" id="Input_quantidade">
                <input type="number" name="" id="Input_preco" placeholder="Preço" step="0.01" min="0" >
                <button id="button_add">Adicionar venda</button>
            </form>
        </div>
        <hr>
        <div class="container ">
            <div class="row d-flex flex-row col-12 gap-3">
                <div class="col mt-3 col-7 table-scroll pt-3" id="Vendas">
                    <table class="table table-white  table-hover border border-1 shadow-sm rounded">
                        <thead class="table-light ">
                            <tr>
                                
                                <th>Produto</th>
                                <th>Quantidade</th>
                                <th>Preço</th>
                             
                            </tr>
                        </thead>
                        <tbody id="tbody_vendas">
                           
                            
                        </tbody>
                    </table>
                </div>
                <div class="col-4" id="Caixa">
                    <h2 class="mt-3">Total de vendas do dia</h2>
                    <h1>R$ <span id="Caixa_caunt">0.00</span></h1>
                    <button class="btn btn-danger mt-3 mb-2" id="button_clear" onclick="LimparCaixa()">Limpar caixa</button>
                </div>
            </div>
        </div>
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="exampleModalLabel">Cadastrar produto</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <form action="" onsubmit="AdicionarProduto(event)">
                    <input type="text" placeholder="Nome do produto" id="Input_nome_produto" >
                    <button id="button_cadastrar_produto">Adicionar produto</button>
                  </form>
                </div>
                
              </div>
            </div>
          </div>

    </main>
    <script src="js/index.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
  
  </body>
</body>
</html>
